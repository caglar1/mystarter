{% raw %}{% if messages %}
    {% for message in messages %}
        <div x-data="{ show: true }" 
             x-init="setTimeout(() => show = false, 4000)" 
             x-show="show" 
             x-transition:enter="transition ease-out duration-300 transform"
             x-transition:enter-start="opacity-0 translate-y-2"
             x-transition:enter-end="opacity-100 translate-y-0"
             x-transition:leave="transition ease-in duration-200 transform"
             x-transition:leave-start="opacity-100 translate-y-0"
             x-transition:leave-end="opacity-0 translate-y-2"
             class="alert shadow-lg pointer-events-auto max-w-sm {% if message.tags == 'success' %}alert-success text-success-content{% elif message.tags == 'error' %}alert-error text-error-content{% elif message.tags == 'warning' %}alert-warning text-warning-content{% else %}alert-info text-info-content{% endif %} flex items-center justify-between gap-3 mb-2">
            
            <div class="flex items-center gap-2">
                {% if message.tags == 'success' %}
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                {% elif message.tags == 'error' %}
                    <i data-lucide="alert-octagon" class="w-5 h-5"></i>
                {% else %}
                    <i data-lucide="info" class="w-5 h-5"></i>
                {% endif %}
                <span class="text-sm font-medium">{{ message }}</span>
            </div>

            <button @click="show = false" class="btn btn-ghost btn-xs btn-circle opacity-70 hover:opacity-100">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    {% endfor %}
{% endif %}{% endraw %}
